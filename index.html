<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exposición</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      background-color: #121417;
    }

    .escenario { flex: 1; display: flex; align-items: stretch; min-height: 0; }

    .nav-lateral {
      flex: 0 0 72px;
      border: 0;
      border-radius: 0;
      background-color: #1b1f24;
      color: #e8eaed;
      font-size: 2rem;
      transition: background-color .2s;
    }
    .nav-lateral:hover { background-color: #2a3038; }
    .nav-lateral:focus-visible { outline: 3px solid #6ea8fe; outline-offset: -3px; }

    /* Centro: aquí se muestran los archivos de cada tema */
    .contenido {
      flex: 1;
      position: relative;
      min-width: 0;
    }
    .contenido.vacio {
      border: 2px dashed #3a414a;
      margin: 1rem;
      border-radius: .5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #marco {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background-color: #121417;
    }

    @media (max-width: 576px) {
      .nav-lateral { flex-basis: 48px; font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <nav class="navbar bg-body-tertiary border-bottom border-secondary">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1" id="nombreExpo">Exposición</span>
      <span class="navbar-text" id="tituloTema"></span>
    </div>
  </nav>
  <div class="progress rounded-0" style="height:4px;background:#1b1f24">
    <div class="progress-bar" id="barra" style="width:0;background:linear-gradient(90deg,#2f6bff,#8b5cf6);transition:width .4s"></div>
  </div>

  <main class="escenario">
    <button class="nav-lateral" id="btnAnterior" aria-label="Tema anterior">&#10094;</button>

    <section class="contenido vacio" id="contenido">
      <p class="text-secondary mb-0" id="mensajeVacio">Aún no hay temas. Agrégalos en temas.js</p>
      <iframe id="marco" title="Contenido del tema" hidden></iframe>
    </section>

    <button class="nav-lateral" id="btnSiguiente" aria-label="Tema siguiente">&#10095;</button>
  </main>

  <footer class="bg-body-tertiary border-top border-secondary text-center text-secondary py-2">
    <small id="contador">&nbsp;</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="temas.js"></script>
  <script>
    var temas = window.TEMAS || [];
    var actual = 0;

    var btnPrev = document.getElementById('btnAnterior');
    var btnNext = document.getElementById('btnSiguiente');
    var marco = document.getElementById('marco');
    var contenido = document.getElementById('contenido');
    var mensajeVacio = document.getElementById('mensajeVacio');
    var tituloTema = document.getElementById('tituloTema');
    var contador = document.getElementById('contador');
    var barra = document.getElementById('barra');

    if (window.NOMBRE_EXPOSICION) {
      document.getElementById('nombreExpo').textContent = window.NOMBRE_EXPOSICION;
      document.title = window.NOMBRE_EXPOSICION;
    }

    function mostrar(i) {
      // Sin temas: sin flechas y mensaje de vacío
      if (temas.length === 0) {
        btnPrev.classList.add('invisible');
        btnNext.classList.add('invisible');
        barra.style.width = '0';
        marco.hidden = true;
        mensajeVacio.hidden = false;
        contenido.classList.add('vacio');
        return;
      }

      actual = Math.max(0, Math.min(i, temas.length - 1));

      marco.hidden = false;
      mensajeVacio.hidden = true;
      contenido.classList.remove('vacio');
      marco.src = temas[actual].archivo;

      tituloTema.textContent = temas[actual].titulo || '';
      contador.textContent = (actual + 1) + ' / ' + temas.length;
      barra.style.width = ((actual + 1) / temas.length * 100) + '%';

      // Flechas: se ocultan si no hay tema anterior o siguiente
      btnPrev.classList.toggle('invisible', actual === 0);
      btnNext.classList.toggle('invisible', actual === temas.length - 1);

      history.replaceState(null, '', '#' + (actual + 1));
    }

    btnPrev.addEventListener('click', function () { mostrar(actual - 1); });
    btnNext.addEventListener('click', function () { mostrar(actual + 1); });

    // Teclado: flechas izquierda y derecha
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') mostrar(actual - 1);
      if (e.key === 'ArrowRight') mostrar(actual + 1);
    });

    // Órdenes enviadas desde dentro de cada tema (teclado y gestos)
    window.addEventListener('message', function (e) {
      if (!e.data) return;
      if (e.data.nav === 'prev') mostrar(actual - 1);
      if (e.data.nav === 'next') mostrar(actual + 1);
    });

    // Gestos táctiles sobre el esqueleto
    var x0 = null;
    document.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
    document.addEventListener('touchend', function (e) {
      if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0;
      if (Math.abs(dx) > 60) mostrar(actual + (dx < 0 ? 1 : -1));
      x0 = null;
    }, { passive: true });

    // Al abrir, respeta el número del tema en la dirección (#2, #3...)
    var inicio = parseInt(location.hash.slice(1), 10);
    mostrar(isNaN(inicio) ? 0 : inicio - 1);
  </script>
</body>
</html>
